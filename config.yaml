# idea-engine 配置
interval: 20          # 潜意识 tick 间隔（秒）—— 未启用动态频率时的基础值

# 动态心跳频率（可选）：白天活跃、晚上慢
timezone: ""            # 时区（如 Asia/Shanghai），留空=用实例本地时区
active_hours: "09:00-23:00"   # 活跃时段 HH:MM-HH:MM（留空=不启用动态频率，用 interval）
active_interval: 90           # 活跃时段 tick 间隔（秒）
rest_interval: 3600           # 非活跃时段 tick 间隔（秒）——晚上安静，不打扰别人

# 粘人程度（0-1，缩放「proactive_files」的触发权重，越高越主动找对方）
clinginess: 1.0
proactive_files: "关于你,关于朋友"   # 触发「主动找对方」的人设文件名关键词（逗号分隔）

limit: 1              # 每轮生成条数（默认 1 条）
recent: 20            # 生成时回看最近 N 条已有想法
max_chars: 20000      # 喂给模型的原料字符上限
methods: 联想,类比,比喻,反转,嫁接,跨界组合,逆向,极端化,欲望   # 每轮随机选一种

# 触发权重（概率触发，非确定）
fact_weight: 3.0        # 事实的触发权重（高于想法）
idea_weight: 1.0        # 想法的触发权重
recency_half_life: 86400.0   # 新旧衰减半衰期（秒），越小越偏爱新文件

# 蒸馏 / 遗忘（判别层）
distill_age: 3600       # 想法多久后开始蒸馏（秒）
distill_max: 3          # 蒸馏到第几轮后遗忘（压缩到 0）

# LLM 接口（OpenAI 兼容）—— 潜意识 & 判别层用
# 敏感信息勿提交 git！优先用环境变量 HEART_BASE_URL / HEART_API_KEY 注入。
# 下方空值仅作占位，真实值请用环境变量或本地未跟踪的配置填入。
base_url: ""
api_key: ""
model: deepseek-v4-flash
temperature: 0.8

# 执行层「身体」（可插拔）—— heart 的想/记忆独立于执行后端
executor: hermes                     # hermes / opencode
hermes_base_url: http://127.0.0.1:8642   # Hermes API Server（OpenAI 协议）
hermes_api_key: ""                   # 用环境变量 HERMES_API_KEY 注入
hermes_model: hermes-agent
